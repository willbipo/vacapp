<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Inventario de Ganado - Vacapp</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <style>
    .modal {
      position: fixed;
      top: 0;
      left: 0;
      right: 0;
      bottom: 0;
      background-color: rgba(0, 0, 0, 0.5);
      display: flex;
      align-items: center;
      justify-content: center;
      z-index: 1000;
    }
    .modal.hidden {
      display: none;
    }
    .modal-content {
      background-color: white;
      border-radius: 0.5rem;
      box-shadow: 0 10px 25px rgba(0, 0, 0, 0.1);
      max-width: 600px;
      width: 90%;
      max-height: 90vh;
      display: flex;
      flex-direction: column;
    }
    .modal-header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 1.5rem;
      border-bottom: 1px solid #e5e7eb;
    }
    .modal-body-scroll {
      padding: 1.5rem;
      overflow-y: auto;
      flex: 1;
      min-height: 0;
    }
    .modal-footer {
      padding: 1.5rem;
      border-top: 1px solid #e5e7eb;
    }
  </style>
</head>
<body class="bg-gray-50">
  <div class="container mx-auto px-4 py-8">
    <!-- Header -->
    <header class="mb-6">
      <div class="flex items-center justify-between">
        <div>
          <h1 class="text-3xl font-bold text-gray-900">Inventario de Ganado</h1>
          <p class="text-gray-600 mt-1">Gestión del inventario animal de tus ranchos</p>
        </div>
        <a href="/views/dashboard.html" class="px-4 py-2 bg-gray-200 text-gray-700 rounded-lg hover:bg-gray-300 transition">Volver al Dashboard</a>
      </div>
    </header>

    <!-- Filtros -->
    <div class="bg-white rounded-lg shadow mb-6 p-6">
      <h2 class="text-lg font-semibold mb-4">Filtros</h2>
      <div class="flex items-center gap-4 flex-wrap">
        <div class="flex-1 min-w-[200px]">
          <label class="block text-sm font-medium text-gray-700 mb-1">Filtrar por Rancho</label>
          <select id="filtro-rancho" class="w-full px-3 py-2 border border-gray-300 rounded-lg focus:outline-none focus:ring-2 focus:ring-blue-500" onchange="filtrarPorRancho()">
            <option value="">Todos los ranchos</option>
          </select>
        </div>
        <div class="flex-1 min-w-[150px]">
          <label class="block text-sm font-medium text-gray-700 mb-1">Estatus</label>
          <select id="filtro-estatus" class="w-full px-3 py-2 border border-gray-300 rounded-lg focus:outline-none focus:ring-2 focus:ring-blue-500" onchange="filtrarTabla()">
            <option value="">Todos</option>
            <option value="VIGENTE">Vigente</option>
            <option value="BAJA">Baja</option>
          </select>
        </div>
        <div class="flex-1 min-w-[150px]">
          <label class="block text-sm font-medium text-gray-700 mb-1">Sexo</label>
          <select id="filtro-sexo" class="w-full px-3 py-2 border border-gray-300 rounded-lg focus:outline-none focus:ring-2 focus:ring-blue-500" onchange="filtrarTabla()">
            <option value="">Todos</option>
            <option value="HEMBRA">Hembra</option>
            <option value="MACHO">Macho</option>
          </select>
        </div>
        <div class="flex-1 min-w-[150px]">
          <label class="block text-sm font-medium text-gray-700 mb-1">Tipo</label>
          <select id="filtro-tipo" class="w-full px-3 py-2 border border-gray-300 rounded-lg focus:outline-none focus:ring-2 focus:ring-blue-500" onchange="filtrarTabla()">
            <option value="">Todos</option>
            <option value="LECHERO">Lechero</option>
            <option value="CARNE">Carne</option>
            <option value="DOBLE_PROPOSITO">Doble Propósito</option>
          </select>
        </div>
        <div>
          <button class="px-4 py-2 bg-blue-600 text-white rounded-lg hover:bg-blue-700 transition" onclick="limpiarFiltros()">Limpiar</button>
        </div>
      </div>
    </div>

    <!-- Estadísticas -->
    <div class="grid grid-cols-1 md:grid-cols-4 gap-4 mb-6">
      <div class="bg-white rounded-lg shadow p-6 text-center">
        <div class="text-2xl font-bold text-blue-600" id="stat-total">0</div>
        <div class="text-sm text-gray-600">Total Animales</div>
      </div>
      <div class="bg-white rounded-lg shadow p-6 text-center">
        <div class="text-2xl font-bold text-green-600" id="stat-vigentes">0</div>
        <div class="text-sm text-gray-600">Vigentes</div>
      </div>
      <div class="bg-white rounded-lg shadow p-6 text-center">
        <div class="text-2xl font-bold text-red-600" id="stat-baja">0</div>
        <div class="text-sm text-gray-600">Baja</div>
      </div>
      <div class="bg-white rounded-lg shadow p-6 text-center">
        <div class="text-2xl font-bold text-indigo-600" id="stat-hembras">0</div>
        <div class="text-sm text-gray-600">Hembras</div>
      </div>
    </div>

    <!-- Tabla de Ganado -->
    <div class="bg-white rounded-lg shadow">
      <div class="p-6 border-b flex items-center justify-between">
        <h2 class="text-lg font-semibold">Lista de Animales</h2>
        <button class="px-4 py-2 bg-blue-600 text-white rounded-lg hover:bg-blue-700 transition" onclick="abrirModalCrear()">+ Nuevo Animal</button>
      </div>
      
      <div class="overflow-x-auto">
        <table class="w-full" id="tabla-animales">
          <thead class="bg-gray-50">
            <tr>
              <th class="px-6 py-3 text-left text-xs font-medium text-gray-500 uppercase tracking-wider">Arete</th>
              <th class="px-6 py-3 text-left text-xs font-medium text-gray-500 uppercase tracking-wider">Raza</th>
              <th class="px-6 py-3 text-left text-xs font-medium text-gray-500 uppercase tracking-wider">Sexo</th>
              <th class="px-6 py-3 text-left text-xs font-medium text-gray-500 uppercase tracking-wider">Estatus</th>
              <th class="px-6 py-3 text-left text-xs font-medium text-gray-500 uppercase tracking-wider">Tipo</th>
              <th class="px-6 py-3 text-left text-xs font-medium text-gray-500 uppercase tracking-wider">Edad (meses)</th>
              <th class="px-6 py-3 text-left text-xs font-medium text-gray-500 uppercase tracking-wider">Fecha Nacimiento</th>
              <th class="px-6 py-3 text-left text-xs font-medium text-gray-500 uppercase tracking-wider">Rancho</th>
              <th class="px-6 py-3 text-right text-xs font-medium text-gray-500 uppercase tracking-wider">Acciones</th>
            </tr>
          </thead>
          <tbody id="tabla-ganado" class="bg-white divide-y divide-gray-200">
            <!-- Los datos se cargarán dinámicamente con JavaScript -->
          </tbody>
        </table>
      </div>
    </div>
  </div>

  <!-- Modal Crear/Editar Animal -->
  <div id="modal-animal" class="modal hidden">
    <div class="modal-content">
      <div class="modal-header">
        <h3 id="modal-titulo" class="text-lg font-semibold">Nuevo Animal</h3>
        <button class="text-gray-400 hover:text-gray-600 text-2xl" onclick="cerrarModal()">&times;</button>
      </div>
      <form id="formulario-animal" onsubmit="guardarAnimal(event)">
        <input type="hidden" id="animal-id">
        
        <div class="modal-body-scroll">
          <div class="grid grid-cols-2 gap-4">
            <div class="mb-4">
              <label class="block text-sm font-medium text-gray-700 mb-1">Número Identificador *</label>
              <input type="text" id="animal-numeroIdentificador" class="w-full px-3 py-2 border border-gray-300 rounded-lg focus:outline-none focus:ring-2 focus:ring-blue-500" required>
            </div>
            
            <div class="mb-4">
              <label class="block text-sm font-medium text-gray-700 mb-1">Raza *</label>
              <input type="text" id="animal-raza" class="w-full px-3 py-2 border border-gray-300 rounded-lg focus:outline-none focus:ring-2 focus:ring-blue-500" required>
            </div>
            
            <div class="mb-4">
              <label class="block text-sm font-medium text-gray-700 mb-1">Sexo *</label>
              <select id="animal-sexo" class="w-full px-3 py-2 border border-gray-300 rounded-lg focus:outline-none focus:ring-2 focus:ring-blue-500" required>
                <option value="">Seleccionar</option>
                <option value="HEMBRA">Hembra</option>
                <option value="MACHO">Macho</option>
              </select>
            </div>
            
            <div class="mb-4">
              <label class="block text-sm font-medium text-gray-700 mb-1">Estatus *</label>
              <select id="animal-estatus" class="w-full px-3 py-2 border border-gray-300 rounded-lg focus:outline-none focus:ring-2 focus:ring-blue-500" required>
                <option value="VIGENTE">Vigente</option>
                <option value="BAJA">Baja</option>
              </select>
            </div>
            
            <div class="mb-4">
              <label class="block text-sm font-medium text-gray-700 mb-1">Tipo *</label>
              <select id="animal-tipo" class="w-full px-3 py-2 border border-gray-300 rounded-lg focus:outline-none focus:ring-2 focus:ring-blue-500" required>
                <option value="">Seleccionar</option>
                <option value="LECHERO">Lechero</option>
                <option value="CARNE">Carne</option>
                <option value="DOBLE_PROPOSITO">Doble Propósito</option>
              </select>
            </div>
            
            <div class="mb-4">
              <label class="block text-sm font-medium text-gray-700 mb-1">Meses</label>
              <input type="number" id="animal-meses" class="w-full px-3 py-2 border border-gray-300 rounded-lg focus:outline-none focus:ring-2 focus:ring-blue-500">
            </div>
            
            <div class="mb-4">
              <label class="block text-sm font-medium text-gray-700 mb-1">Fecha Nacimiento</label>
              <input type="date" id="animal-fechaNacimiento" class="w-full px-3 py-2 border border-gray-300 rounded-lg focus:outline-none focus:ring-2 focus:ring-blue-500">
            </div>
            
            <div class="mb-4">
              <label class="block text-sm font-medium text-gray-700 mb-1">Fecha Aretado</label>
              <input type="date" id="animal-fechaAretado" class="w-full px-3 py-2 border border-gray-300 rounded-lg focus:outline-none focus:ring-2 focus:ring-blue-500">
            </div>
          </div>
          
          <div class="mb-4">
            <label class="block text-sm font-medium text-gray-700 mb-1">Rancho *</label>
            <select id="animal-rancho" class="w-full px-3 py-2 border border-gray-300 rounded-lg focus:outline-none focus:ring-2 focus:ring-blue-500" required>
              <option value="">Seleccionar rancho</option>
            </select>
          </div>
          
          <div class="mb-4">
            <label class="block text-sm font-medium text-gray-700 mb-1">Arete Anterior</label>
            <input type="text" id="animal-areteAnterior" class="w-full px-3 py-2 border border-gray-300 rounded-lg focus:outline-none focus:ring-2 focus:ring-blue-500">
          </div>
          
          <div class="mb-4">
            <label class="block text-sm font-medium text-gray-700 mb-1">Folio REEMO</label>
            <input type="text" id="animal-folioReemo" class="w-full px-3 py-2 border border-gray-300 rounded-lg focus:outline-none focus:ring-2 focus:ring-blue-500">
          </div>
          
          <div class="mb-4">
            <label class="block text-sm font-medium text-gray-700 mb-1">Nota</label>
            <textarea id="animal-nota" class="w-full px-3 py-2 border border-gray-300 rounded-lg focus:outline-none focus:ring-2 focus:ring-blue-500" rows="3"></textarea>
          </div>
        </div>
        
        <div class="modal-footer">
          <div class="flex justify-end gap-2">
            <button type="button" class="px-4 py-2 bg-gray-200 text-gray-700 rounded-lg hover:bg-gray-300 transition" onclick="cerrarModal()">Cancelar</button>
            <button type="submit" class="px-4 py-2 bg-blue-600 text-white rounded-lg hover:bg-blue-700 transition">Guardar</button>
          </div>
        </div>
      </form>
    </div>
  </div>

  <script src="/js/ganado.js"></script>
</body>
</html>
