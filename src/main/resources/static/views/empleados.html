<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Inventario de Empleados - Vacapp</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <style>
    .modal {
      position: fixed;
      top: 0;
      left: 0;
      right: 0;
      bottom: 0;
      background-color: rgba(0, 0, 0, 0.5);
      display: flex;
      align-items: center;
      justify-content: center;
      z-index: 1000;
    }
    .modal.hidden {
      display: none;
    }
    .modal-content {
      background-color: white;
      border-radius: 0.5rem;
      box-shadow: 0 10px 25px rgba(0, 0, 0, 0.1);
      max-width: 500px;
      width: 90%;
      max-height: 90vh;
      display: flex;
      flex-direction: column;
    }
    .modal-header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 1.5rem;
      border-bottom: 1px solid #e5e7eb;
    }
    .modal-body-scroll {
      padding: 1.5rem;
      overflow-y: auto;
      flex: 1;
      min-height: 0;
    }
    .modal-footer {
      padding: 1.5rem;
      border-top: 1px solid #e5e7eb;
    }
  </style>
</head>
<body class="bg-gray-50">
  <div class="container mx-auto px-4 py-8">
    <!-- Header -->
    <header class="mb-6">
      <div class="flex items-center justify-between">
        <div>
          <h1 class="text-3xl font-bold text-gray-900">Inventario de Empleados</h1>
          <p class="text-gray-600 mt-1">Gestión del personal de tus ranchos</p>
        </div>
        <a href="/views/dashboard.html" class="px-4 py-2 bg-gray-200 text-gray-700 rounded-lg hover:bg-gray-300 transition">Volver al Dashboard</a>
      </div>
    </header>

    <!-- Filtros -->
    <div class="bg-white rounded-lg shadow mb-6 p-6">
      <h2 class="text-lg font-semibold mb-4">Filtros</h2>
      <div class="flex items-center gap-4">
        <div class="flex-1">
          <label class="block text-sm font-medium text-gray-700 mb-1">Filtrar por Rancho</label>
          <select id="filtro-rancho" class="w-full px-3 py-2 border border-gray-300 rounded-lg focus:outline-none focus:ring-2 focus:ring-blue-500" onchange="filtrarPorRancho()">
            <option value="">Todos los ranchos</option>
          </select>
        </div>
        <div>
          <button class="px-4 py-2 bg-blue-600 text-white rounded-lg hover:bg-blue-700 transition" onclick="limpiarFiltros()">Limpiar Filtros</button>
        </div>
      </div>
    </div>

    <!-- Estadísticas -->
    <div class="grid grid-cols-1 md:grid-cols-4 gap-4 mb-6">
      <div class="bg-white rounded-lg shadow p-6 text-center">
        <div class="text-2xl font-bold text-blue-600" id="stat-total">0</div>
        <div class="text-sm text-gray-600">Total Empleados</div>
      </div>
      <div class="bg-white rounded-lg shadow p-6 text-center">
        <div class="text-2xl font-bold text-green-600" id="stat-activos">0</div>
        <div class="text-sm text-gray-600">Activos</div>
      </div>
      <div class="bg-white rounded-lg shadow p-6 text-center">
        <div class="text-2xl font-bold text-yellow-600" id="stat-pendientes">0</div>
        <div class="text-sm text-gray-600">Pendientes</div>
      </div>
      <div class="bg-white rounded-lg shadow p-6 text-center">
        <div class="text-2xl font-bold text-red-600" id="stat-inactivos">0</div>
        <div class="text-sm text-gray-600">Inactivos</div>
      </div>
    </div>

    <!-- Tabla de Empleados -->
    <div class="bg-white rounded-lg shadow">
      <div class="p-6 border-b flex items-center justify-between">
        <h2 class="text-lg font-semibold">Lista de Empleados</h2>
        <button class="px-4 py-2 bg-blue-600 text-white rounded-lg hover:bg-blue-700 transition" onclick="abrirModalCrear()">+ Nuevo Empleado</button>
      </div>
      
      <div class="overflow-x-auto">
        <table class="w-full">
          <thead class="bg-gray-50">
            <tr>
              <th class="px-6 py-3 text-left text-xs font-medium text-gray-500 uppercase tracking-wider">Nombre</th>
              <th class="px-6 py-3 text-left text-xs font-medium text-gray-500 uppercase tracking-wider">Email</th>
              <th class="px-6 py-3 text-left text-xs font-medium text-gray-500 uppercase tracking-wider">Teléfono</th>
              <th class="px-6 py-3 text-left text-xs font-medium text-gray-500 uppercase tracking-wider">Rol</th>
              <th class="px-6 py-3 text-left text-xs font-medium text-gray-500 uppercase tracking-wider">Estado</th>
              <th class="px-6 py-3 text-left text-xs font-medium text-gray-500 uppercase tracking-wider">Rancho</th>
              <th class="px-6 py-3 text-left text-xs font-medium text-gray-500 uppercase tracking-wider">Fecha Registro</th>
              <th class="px-6 py-3 text-right text-xs font-medium text-gray-500 uppercase tracking-wider">Acciones</th>
            </tr>
          </thead>
          <tbody id="tabla-empleados" class="bg-white divide-y divide-gray-200">
            <!-- Los datos se cargarán dinámicamente con JavaScript -->
          </tbody>
        </table>
      </div>
    </div>
  </div>

  <!-- Modal Crear/Editar Empleado -->
  <div id="modal-empleado" class="modal hidden">
    <div class="modal-content">
      <div class="modal-header">
        <h3 id="modal-titulo" class="text-lg font-semibold">Nuevo Empleado</h3>
        <button class="text-gray-400 hover:text-gray-600 text-2xl" onclick="cerrarModal()">&times;</button>
      </div>
      <form id="formulario-empleado" onsubmit="guardarEmpleado(event)">
        <input type="hidden" id="empleado-id">
        
        <div class="modal-body-scroll">
          <div class="mb-4">
            <label class="block text-sm font-medium text-gray-700 mb-1">Nombre *</label>
            <input type="text" id="empleado-nombre" class="w-full px-3 py-2 border border-gray-300 rounded-lg focus:outline-none focus:ring-2 focus:ring-blue-500" required>
          </div>
          
          <div class="mb-4">
            <label class="block text-sm font-medium text-gray-700 mb-1">Email *</label>
            <input type="email" id="empleado-email" class="w-full px-3 py-2 border border-gray-300 rounded-lg focus:outline-none focus:ring-2 focus:ring-blue-500" required>
          </div>
          
          <div class="mb-4">
            <label class="block text-sm font-medium text-gray-700 mb-1">Teléfono</label>
            <input type="tel" id="empleado-telefono" class="w-full px-3 py-2 border border-gray-300 rounded-lg focus:outline-none focus:ring-2 focus:ring-blue-500">
          </div>
          
          <div class="mb-4">
            <label class="block text-sm font-medium text-gray-700 mb-1">Rol *</label>
            <select id="empleado-rol" class="w-full px-3 py-2 border border-gray-300 rounded-lg focus:outline-none focus:ring-2 focus:ring-blue-500" required>
              <option value="">Seleccionar rol</option>
              <option value="DOCTOR">Doctor (Veterinario)</option>
              <option value="WORKER">Worker (Trabajador)</option>
            </select>
          </div>
          
          <div class="mb-4">
            <label class="block text-sm font-medium text-gray-700 mb-1">Rancho *</label>
            <select id="empleado-rancho" class="w-full px-3 py-2 border border-gray-300 rounded-lg focus:outline-none focus:ring-2 focus:ring-blue-500" required>
              <option value="">Seleccionar rancho</option>
            </select>
          </div>
          
          <div class="mb-4">
            <label class="block text-sm font-medium text-gray-700 mb-1">Estado *</label>
            <select id="empleado-estado" class="w-full px-3 py-2 border border-gray-300 rounded-lg focus:outline-none focus:ring-2 focus:ring-blue-500" required>
              <option value="ACTIVO">Activo</option>
              <option value="INACTIVO">Inactivo</option>
              <option value="PENDIENTE">Pendiente de aceptación</option>
            </select>
          </div>
        </div>
        
        <div class="modal-footer">
          <div class="flex justify-end gap-2">
            <button type="button" class="px-4 py-2 bg-gray-200 text-gray-700 rounded-lg hover:bg-gray-300 transition" onclick="cerrarModal()">Cancelar</button>
            <button type="submit" class="px-4 py-2 bg-blue-600 text-white rounded-lg hover:bg-blue-700 transition">Guardar</button>
          </div>
        </div>
      </form>
    </div>
  </div>

  <script src="/js/empleados.js"></script>
</body>
</html>
