spring.application.name=Vacapp

# ── Base de Datos H2 (en memoria para desarrollo) ────────────────────────────────
# Para usar MySQL en producción, cambia estos valores
spring.datasource.url=jdbc:h2:mem:vacapp_db
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=

# ── Base de Datos MySQL (comentada para desarrollo) ────────────────────────────────
# spring.datasource.url=jdbc:mysql://localhost:3306/vacapp_db?useSSL=false&serverTimezone=UTC&allowPublicKeyRetrieval=true
# spring.datasource.username=root
# spring.datasource.password=
# spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# ── Spring Data JDBC ────────────────────────────────────────────────────────────
spring.sql.init.mode=never
spring.h2.console.enabled=true

# ── JWT ────────────────────────────────────────────────────────────────────────
# Sustituye el valor por una clave de al menos 256 bits (32+ caracteres) en producción
vacapp.jwt.secreto=vacapp-clave-secreta-debe-tener-al-menos-256-bits-para-hs256-segura
vacapp.jwt.expiracion-ms=86400000
