spring.application.name=Vacapp

# ── Base de Datos MySQL ────────────────────────────────────────────────────────
spring.datasource.url=jdbc:mysql://localhost:3306/vacapp_db?useSSL=false&serverTimezone=UTC&allowPublicKeyRetrieval=true
spring.datasource.username=root
spring.datasource.password=
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# ── Spring Data JDBC ────────────────────────────────────────────────────────────
spring.sql.init.mode=never

# ── JWT ────────────────────────────────────────────────────────────────────────
# Sustituye el valor por una clave de al menos 256 bits (32+ caracteres) en producción
vacapp.jwt.secreto=vacapp-clave-secreta-debe-tener-al-menos-256-bits-para-hs256-segura
vacapp.jwt.expiracion-ms=86400000

# ── OpenAPI / Swagger UI (Design-First) ────────────────────────────────────────
# Deshabilita el escaneo de anotaciones del classpath; la fuente de verdad son los YAML.
springdoc.api-docs.enabled=true
springdoc.swagger-ui.enabled=true
springdoc.swagger-ui.path=/swagger-ui/index.html
# Vista continua: ordena los tags en el mismo orden que los YAMLs (auth → ganado → insumos → vacunas)
springdoc.swagger-ui.tags-sorter=alpha
springdoc.swagger-ui.operations-sorter=alpha
# Expande todos los bloques por defecto (sin menús desplegables)
springdoc.swagger-ui.doc-expansion=list
# Desactiva el escaneo de controladores para no duplicar rutas ya definidas en los YAML
springdoc.packages-to-scan=com.vacapp.____ninguno____
