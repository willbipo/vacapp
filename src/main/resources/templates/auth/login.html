<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Vacapp — Iniciar sesión</title>
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="min-h-screen bg-gradient-to-br from-green-50 to-emerald-100 flex items-center justify-center p-4">

    <div class="w-full max-w-md">

        <!-- Logo / Encabezado -->
        <div class="text-center mb-8">
            <div class="inline-flex items-center justify-center w-16 h-16 bg-emerald-600 rounded-2xl mb-4 shadow-lg">
                <svg class="w-9 h-9 text-white" viewBox="0 0 24 24" fill="currentColor">
                    <path d="M12 2C8.13 2 5 5.13 5 9c0 5.25 7 13 7 13s7-7.75 7-13c0-3.87-3.13-7-7-7zm0 9.5c-1.38 0-2.5-1.12-2.5-2.5s1.12-2.5 2.5-2.5 2.5 1.12 2.5 2.5-1.12 2.5-2.5 2.5z"/>
                </svg>
            </div>
            <h1 class="text-3xl font-bold text-gray-900">Vacapp</h1>
            <p class="text-gray-500 mt-1 text-sm">Gestión ganadera inteligente</p>
        </div>

        <!-- Tarjeta del formulario -->
        <div class="bg-white rounded-2xl shadow-xl p-8">
            <h2 class="text-xl font-semibold text-gray-800 mb-6">Iniciar sesión</h2>

            <!-- Alerta de error -->
            <div id="alerta-error" class="hidden flex items-start gap-3 bg-red-50 border border-red-200 text-red-700 rounded-lg px-4 py-3 mb-5 text-sm">
                <svg class="w-5 h-5 mt-0.5 flex-shrink-0" fill="currentColor" viewBox="0 0 20 20">
                    <path fill-rule="evenodd" d="M18 10a8 8 0 11-16 0 8 8 0 0116 0zm-7 4a1 1 0 11-2 0 1 1 0 012 0zm-1-9a1 1 0 00-1 1v4a1 1 0 102 0V6a1 1 0 00-1-1z" clip-rule="evenodd"/>
                </svg>
                <span id="mensaje-error">Credenciales inválidas. Inténtalo de nuevo.</span>
                <button onclick="cerrarError()" class="ml-auto text-red-400 hover:text-red-600">✕</button>
            </div>

            <form id="formulario-login" class="space-y-5" novalidate>

                <!-- Campo usuario -->
                <div>
                    <label for="username" class="block text-sm font-medium text-gray-700 mb-1.5">Usuario</label>
                    <div class="relative">
                        <div class="absolute inset-y-0 left-0 pl-3 flex items-center pointer-events-none">
                            <svg class="w-5 h-5 text-gray-400" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M16 7a4 4 0 11-8 0 4 4 0 018 0zM12 14a7 7 0 00-7 7h14a7 7 0 00-7-7z"/>
                            </svg>
                        </div>
                        <input id="username" type="text" autocomplete="username" required placeholder="tu_usuario"
                               class="w-full pl-10 pr-4 py-2.5 border border-gray-300 rounded-lg text-sm focus:outline-none focus:ring-2 focus:ring-emerald-500 focus:border-transparent transition"/>
                    </div>
                </div>

                <!-- Campo contraseña -->
                <div>
                    <label for="password" class="block text-sm font-medium text-gray-700 mb-1.5">Contraseña</label>
                    <div class="relative">
                        <div class="absolute inset-y-0 left-0 pl-3 flex items-center pointer-events-none">
                            <svg class="w-5 h-5 text-gray-400" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 15v2m-6 4h12a2 2 0 002-2v-6a2 2 0 00-2-2H6a2 2 0 00-2 2v6a2 2 0 002 2zm10-10V7a4 4 0 00-8 0v4h8z"/>
                            </svg>
                        </div>
                        <input id="password" type="password" autocomplete="current-password" required placeholder="••••••••"
                               class="w-full pl-10 pr-10 py-2.5 border border-gray-300 rounded-lg text-sm focus:outline-none focus:ring-2 focus:ring-emerald-500 focus:border-transparent transition"/>
                        <button type="button" onclick="alternarPassword()"
                                class="absolute inset-y-0 right-0 pr-3 flex items-center text-gray-400 hover:text-gray-600">
                            <svg id="icono-ojo" class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M15 12a3 3 0 11-6 0 3 3 0 016 0z"/>
                                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M2.458 12C3.732 7.943 7.523 5 12 5c4.478 0 8.268 2.943 9.542 7-1.274 4.057-5.064 7-9.542 7-4.477 0-8.268-2.943-9.542-7z"/>
                            </svg>
                        </button>
                    </div>
                </div>

                <!-- Botón de envío -->
                <button type="submit" id="btn-login"
                        class="w-full bg-emerald-600 hover:bg-emerald-700 text-white font-semibold py-2.5 rounded-lg text-sm transition focus:outline-none focus:ring-2 focus:ring-emerald-500 focus:ring-offset-2 disabled:opacity-60 disabled:cursor-not-allowed">
                    <span id="texto-btn">Iniciar sesión</span>
                </button>
            </form>
        </div>
    </div>

    <script>
        // ── Alternar visibilidad de contraseña ──────────────────────────────────
        function alternarPassword() {
            const campo = document.getElementById('password');
            campo.type = campo.type === 'password' ? 'text' : 'password';
        }

        // ── Mostrar / ocultar alerta de error ───────────────────────────────────
        function mostrarError(mensaje) {
            const alerta = document.getElementById('alerta-error');
            document.getElementById('mensaje-error').textContent = mensaje;
            alerta.classList.remove('hidden');
        }

        function cerrarError() {
            document.getElementById('alerta-error').classList.add('hidden');
        }

        // ── Envío del formulario via fetch (JWT) ────────────────────────────────
        document.getElementById('formulario-login').addEventListener('submit', async (e) => {
            e.preventDefault();
            cerrarError();

            const usuario   = document.getElementById('username').value.trim();
            const contrasena = document.getElementById('password').value;
            const boton     = document.getElementById('btn-login');
            const textoBton = document.getElementById('texto-btn');

            if (!usuario || !contrasena) {
                mostrarError('Por favor completa todos los campos.');
                return;
            }

            boton.disabled = true;
            textoBton.textContent = 'Iniciando sesión...';

            try {
                const respuesta = await fetch('/api/v1/auth/login', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ username: usuario, password: contrasena })
                });

                if (!respuesta.ok) {
                    const datos = await respuesta.json().catch(() => ({}));
                    mostrarError(datos.mensaje || 'Credenciales inválidas. Inténtalo de nuevo.');
                    return;
                }

                const datos = await respuesta.json();
                // Guardar el token JWT en sessionStorage
                sessionStorage.setItem('vacapp_token', datos.token);
                window.location.href = '/dashboard';

            } catch (_) {
                mostrarError('No se pudo conectar con el servidor. Verifica tu conexión.');
            } finally {
                boton.disabled = false;
                textoBton.textContent = 'Iniciar sesión';
            }
        });
    </script>
</body>
</html>
