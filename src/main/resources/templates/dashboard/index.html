<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Dashboard - Vacapp</title>
  <link rel="stylesheet" th:href="@{/css/global.css}" />
  <link rel="stylesheet" th:href="@{/css/dashboard.css}" />
</head>
<body>
  <div class="container">
    <!-- Header -->
    <header class="header">
      <div class="flex items-center justify-between">
        <div class="flex items-center gap-3">
          <div class="logo">
            <svg width="40" height="40" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
              <path d="M3 9l9-7 9 7v11a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"></path>
              <polyline points="9 22 9 12 15 12 15 22"></polyline>
            </svg>
          </div>
          <div>
            <h1>Vacapp</h1>
            <p class="text-sm text-gray-600">Sistema de Gestión Ganadera</p>
          </div>
        </div>
        <div class="flex items-center gap-4">
          <span class="text-gray-600" th:text="${usuarioActivo != null ? usuarioActivo : 'Usuario'}"></span>
          <a href="/salida" class="btn btn-secondary">Cerrar Sesión</a>
        </div>
      </div>
    </header>

    <!-- Bienvenida -->
    <div class="card mt-6">
      <h2 class="card-title">Bienvenido a Vacapp</h2>
      <p class="text-gray-600">Selecciona un módulo para comenzar:</p>
    </div>

    <!-- Módulos -->
    <div class="grid grid-cols-3 gap-6 mt-6">
      <!-- Empleados -->
      <a href="/empleados" class="card module-card">
        <div class="module-icon">
          <svg width="48" height="48" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
            <path d="M17 21v-2a4 4 0 0 0-4-4H5a4 4 0 0 0-4 4v2"></path>
            <circle cx="9" cy="7" r="4"></circle>
            <path d="M23 21v-2a4 4 0 0 0-3-3.87"></path>
            <path d="M16 3.13a4 4 0 0 1 0 7.75"></path>
          </svg>
        </div>
        <h3 class="module-title">Empleados</h3>
        <p class="module-description">Gestión de personal y roles</p>
      </a>

      <!-- Ranchos -->
      <a href="/ranchos" class="card module-card">
        <div class="module-icon">
          <svg width="48" height="48" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
            <path d="M3 9l9-7 9 7v11a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"></path>
            <polyline points="9 22 9 12 15 12 15 22"></polyline>
          </svg>
        </div>
        <h3 class="module-title">Ranchos</h3>
        <p class="module-description">Gestión de propiedades y estructura</p>
      </a>

      <!-- Ganado -->
      <a href="/inventario" class="card module-card">
        <div class="module-icon">
          <svg width="48" height="48" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
            <rect x="3" y="3" width="7" height="7"></rect>
            <rect x="14" y="3" width="7" height="7"></rect>
            <rect x="14" y="14" width="7" height="7"></rect>
            <rect x="3" y="14" width="7" height="7"></rect>
          </svg>
        </div>
        <h3 class="module-title">Ganado</h3>
        <p class="module-description">Inventario de animales</p>
      </a>
    </div>

    <!-- Información adicional -->
    <div class="card mt-6">
      <h3 class="card-title">Accesos Rápidos</h3>
      <div class="flex gap-4 mt-4">
        <a href="/ranchos" class="btn btn-secondary">Ver Ranchos</a>
        <a href="/empleados" class="btn btn-secondary">Ver Empleados</a>
        <a href="/inventario" class="btn btn-secondary">Ver Ganado</a>
      </div>
    </div>
  </div>

  <script th:src="@{/js/dashboard.js}"></script>
</body>
</html>
