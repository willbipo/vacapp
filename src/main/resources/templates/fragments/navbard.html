<div th:fragment="navbar">
  <nav class="navbar">
    <button
      type="button"
      class="navbar-hamburger"
      id="hambBtn"
      aria-label="Abrir menú"
    >
      <svg viewBox="0 0 24 24">
        <line x1="3" y1="6" x2="21" y2="6" />
        <line x1="3" y1="12" x2="21" y2="12" />
        <line x1="3" y1="18" x2="21" y2="18" />
      </svg>
    </button>

    <div class="navbar-actions">
      <div class="navbar-user">
        <span class="navbar-user-label">Hola,</span>
        <strong id="navbar-username" th:text="${usuarioActivo} ?: 'Invitado'"
          >Usuario</strong
        >
      </div>
      <button
        type="button"
        class="navbar-logout-btn desktop-only"
        onclick="cerrarSesion()"
      >
        Cerrar sesión
      </button>
    </div>
  </nav>
</div>
