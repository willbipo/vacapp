<!doctype html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Vacapp — Inventario de Vacunas</title>
    <link rel="stylesheet" th:href="@{/css/global.css}" />
    <link rel="stylesheet" th:href="@{/css/navbard.css}" />
    <link rel="stylesheet" th:href="@{/css/sidebard.css}" />
    <link rel="stylesheet" th:href="@{/css/dashboard.css}" />
    <link rel="stylesheet" th:href="@{/css/inventario.css}" />
  </head>
  <body>
    <div class="dashboard-shell">
      <div th:replace="~{fragments/sidebard :: sidebar}"></div>

      <div class="dashboard-main">
        <div th:replace="~{fragments/navbard :: navbar}"></div>

        <main class="dashboard-content">
          <div class="inv-header">
            <div>
              <p class="page-overline">Gestión</p>
              <h1>Inventario de Vacunas</h1>
            </div>
            <button class="btn-primary" onclick="abrirModal()">
              + Agregar vacuna
            </button>
          </div>

          <div class="tabla-wrap">
            <table class="tabla-ganado">
              <thead>
                <tr>
                  <th>Nombre</th>
                  <th>Tipo</th>
                  <th>Laboratorio</th>
                  <th>Vía</th>
                  <th>Dosis</th>
                  <th>Lote</th>
                  <th>Caducidad</th>
                  <th>Stock</th>
                  <th>Unidad</th>
                  <th>Temp.</th>
                  <th>Cada (días)</th>
                  <th>Acciones</th>
                </tr>
              </thead>
              <tbody>
                <tr th:if="${#lists.isEmpty(vacunas)}">
                  <td colspan="12">
                    <div class="empty-state">
                      <svg viewBox="0 0 24 24">
                        <path d="M3 3h18v18H3z" />
                        <path d="M12 8v8" />
                        <path d="M8 12h8" />
                      </svg>
                      <p>No hay vacunas registradas.</p>
                    </div>
                  </td>
                </tr>
                <tr th:each="v : ${vacunas}">
                  <td th:text="${v.nombre}">—</td>
                  <td>
                    <span
                      class="badge badge-vigente"
                      th:text="${v.tipo}"
                    ></span>
                  </td>
                  <td th:text="${v.laboratorio} ?: '—'">—</td>
                  <td th:text="${v.viaAdministracion} ?: '—'">—</td>
                  <td th:text="${v.dosis} ?: '—'">—</td>
                  <td th:text="${v.lote} ?: '—'">—</td>
                  <td th:text="${v.fechaCaducidad} ?: '—'">—</td>
                  <td th:text="${v.stock} ?: '—'">—</td>
                  <td th:text="${v.unidadMedida} ?: '—'">—</td>
                  <td th:text="${v.temperaturaAlmacenamiento} ?: '—'">—</td>
                  <td
                    th:text="${v.intervaloDias != null} ? ${v.intervaloDias} + ' días' : '—'"
                  >
                    —
                  </td>
                  <td>
                    <button
                      class="btn-secondary"
                      th:data-id="${v.id}"
                      th:data-nombre="${v.nombre}"
                      th:data-tipo="${v.tipo}"
                      th:data-laboratorio="${v.laboratorio}"
                      th:data-descripcion="${v.descripcion}"
                      th:data-dosis="${v.dosis}"
                      th:data-via="${v.viaAdministracion}"
                      th:data-lote="${v.lote}"
                      th:data-caducidad="${v.fechaCaducidad}"
                      th:data-stock="${v.stock}"
                      th:data-unidad="${v.unidadMedida}"
                      th:data-temp="${v.temperaturaAlmacenamiento}"
                      th:data-intervalo="${v.intervaloDias}"
                      onclick="abrirEditarDesdeBtn(this)"
                    >
                      Editar
                    </button>
                  </td>
                </tr>
              </tbody>
            </table>
          </div>
        </main>
      </div>
    </div>

    <!-- Modal -->
    <div
      class="modal-backdrop"
      id="modalBackdrop"
      onclick="cerrarModalSiAfuera(event)"
    >
      <div class="modal-card" role="dialog" aria-modal="true">
        <p class="modal-title" id="modalTitulo">Agregar vacuna</p>
        <form id="vacunaForm" novalidate>
          <input type="hidden" id="vacunaId" />
          <div class="form-grid">
            <div class="form-field">
              <label>Nombre *</label>
              <input type="text" id="fNombre" required />
            </div>
            <div class="form-field">
              <label>Tipo *</label>
              <select id="fTipo">
                <option value="VIRAL">Viral</option>
                <option value="BACTERIANA">Bacteriana</option>
                <option value="PARASITARIA">Parasitaria</option>
                <option value="COMBINADA">Combinada</option>
                <option value="TOXOIDE">Toxoide</option>
              </select>
            </div>
            <div class="form-field">
              <label>Laboratorio</label>
              <input type="text" id="fLaboratorio" />
            </div>
            <div class="form-field">
              <label>Vía de administración</label>
              <select id="fVia">
                <option value="">— Seleccionar —</option>
                <option value="SUBCUTANEA">Subcutánea</option>
                <option value="INTRAMUSCULAR">Intramuscular</option>
                <option value="ORAL">Oral</option>
                <option value="INTRANASAL">Intranasal</option>
              </select>
            </div>
            <div class="form-field">
              <label>Dosis</label>
              <input type="text" id="fDosis" placeholder="ej. 2 ml" />
            </div>
            <div class="form-field">
              <label>Lote</label>
              <input type="text" id="fLote" />
            </div>
            <div class="form-field">
              <label>Fecha de caducidad</label>
              <input type="date" id="fFechaCaducidad" />
            </div>
            <div class="form-field">
              <label>Stock</label>
              <input type="number" id="fStock" min="0" />
            </div>
            <div class="form-field">
              <label>Unidad de medida</label>
              <input
                type="text"
                id="fUnidad"
                placeholder="ej. dosis, ml, frasco"
              />
            </div>
            <div class="form-field">
              <label>Temperatura almacenamiento</label>
              <input type="text" id="fTemp" placeholder="ej. 2°C a 8°C" />
            </div>
            <div class="form-field">
              <label>Intervalo de aplicación (días)</label>
              <input
                type="number"
                id="fIntervaloDias"
                min="0"
                placeholder="ej. 180"
              />
            </div>
            <div class="form-field full">
              <label>Descripción / Indicaciones</label>
              <textarea id="fDescripcion" rows="3"></textarea>
            </div>
          </div>
          <div class="modal-actions">
            <button type="button" class="btn-secondary" onclick="cerrarModal()">
              Cancelar
            </button>
            <button type="submit" class="btn-primary">Guardar</button>
          </div>
        </form>
      </div>
    </div>

    <script>
      const TOKEN = localStorage.getItem("vacapp_token");
      const API = "/api/v1/vacunas";

      function abrirModal() {
        document.getElementById("modalTitulo").textContent = "Agregar vacuna";
        document.getElementById("vacunaId").value = "";
        document.getElementById("vacunaForm").reset();
        document.getElementById("modalBackdrop").classList.add("open");
      }

      function abrirEditarDesdeBtn(btn) {
        const d = btn.dataset;
        abrirEditar(
          d.id,
          d.nombre,
          d.tipo,
          d.laboratorio,
          d.descripcion,
          d.dosis,
          d.via,
          d.lote,
          d.caducidad,
          d.stock,
          d.unidad,
          d.temp,
          d.intervalo,
        );
      }

      function abrirEditar(
        id,
        nombre,
        tipo,
        lab,
        desc,
        dosis,
        via,
        lote,
        cad,
        stock,
        unidad,
        temp,
        intervalo,
      ) {
        document.getElementById("modalTitulo").textContent = "Editar vacuna";
        document.getElementById("vacunaId").value = id;
        document.getElementById("fNombre").value = nombre;
        document.getElementById("fTipo").value = tipo;
        document.getElementById("fLaboratorio").value =
          lab === "null" ? "" : lab;
        document.getElementById("fDescripcion").value =
          desc === "null" ? "" : desc;
        document.getElementById("fDosis").value = dosis === "null" ? "" : dosis;
        document.getElementById("fVia").value = via === "null" ? "" : via;
        document.getElementById("fLote").value = lote === "null" ? "" : lote;
        document.getElementById("fFechaCaducidad").value =
          cad === "null" ? "" : cad;
        document.getElementById("fStock").value = stock === "null" ? "" : stock;
        document.getElementById("fUnidad").value =
          unidad === "null" ? "" : unidad;
        document.getElementById("fTemp").value = temp === "null" ? "" : temp;
        document.getElementById("fIntervaloDias").value =
          intervalo === "null" ? "" : intervalo;
        document.getElementById("modalBackdrop").classList.add("open");
      }

      function cerrarModal() {
        document.getElementById("modalBackdrop").classList.remove("open");
      }

      function cerrarModalSiAfuera(e) {
        if (e.target === document.getElementById("modalBackdrop"))
          cerrarModal();
      }

      document
        .getElementById("vacunaForm")
        .addEventListener("submit", async function (e) {
          e.preventDefault();
          const id = document.getElementById("vacunaId").value;
          const body = {
            nombre: document.getElementById("fNombre").value.trim(),
            tipo: document.getElementById("fTipo").value,
            laboratorio:
              document.getElementById("fLaboratorio").value.trim() || null,
            descripcion:
              document.getElementById("fDescripcion").value.trim() || null,
            dosis: document.getElementById("fDosis").value.trim() || null,
            viaAdministracion: document.getElementById("fVia").value || null,
            lote: document.getElementById("fLote").value.trim() || null,
            fechaCaducidad:
              document.getElementById("fFechaCaducidad").value || null,
            stock: document.getElementById("fStock").value
              ? parseInt(document.getElementById("fStock").value)
              : null,
            unidadMedida:
              document.getElementById("fUnidad").value.trim() || null,
            temperaturaAlmacenamiento:
              document.getElementById("fTemp").value.trim() || null,
            intervaloDias: document.getElementById("fIntervaloDias").value
              ? parseInt(document.getElementById("fIntervaloDias").value)
              : null,
          };

          const url = id ? `${API}/${id}` : API;
          const method = id ? "PUT" : "POST";

          try {
            const resp = await fetch(url, {
              method,
              headers: {
                "Content-Type": "application/json",
                Authorization: `Bearer ${TOKEN}`,
              },
              body: JSON.stringify(body),
            });
            if (!resp.ok) {
              const err = await resp.json().catch(() => ({}));
              alert("Error: " + (err.error || resp.statusText));
              return;
            }
            cerrarModal();
            location.reload();
          } catch (err) {
            alert("Error de red: " + err.message);
          }
        });

      function cerrarSesion() {
        sessionStorage.removeItem("vacapp_token");
        localStorage.removeItem("vacapp_token");
        document.cookie =
          "vacapp_jwt=; path=/; expires=Thu, 01 Jan 1970 00:00:00 GMT";
        window.location.href = "/auth/login";
      }
    </script>
  </body>
</html>
